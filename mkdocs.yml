theme: databio

site_name: Renal Hypoxia and Metabolic Remodeling in Chronic RAAS Suppression
site_author: Jason Smith
site_url: https://CAAH-analysis.readthedocs.io/en/latest/
repo_url: https://github.com/jpsmith5/CAAH_analysis

markdown_extensions:
  - pymdownx.details
  - attr_list

