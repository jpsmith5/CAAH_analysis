  - "Metabolic Pathway Analysis":
    - About: '5.Analyze_Metabolic_Pathways.md'
    - 1. Metabolic gene sets and functions: '5A.Metabolic_Functions.md'
    - 2. Score metabolic pathways: '5B.Score_Metabolic_Pathways.md'
    - 3. FAO sub-signature decomposition: '5C.FAO_Decomposition.md'
  - "CAAH Molecular Signature":
    - About: '6.CAAH_Signature.md'
    - 1. Derive 10-gene signature: '6A.Derive_CAAH_Signature.md'
    - 2. ROC analysis: '6B.ROC_Analysis.md'
    - 3. CKD273 comparison: '6C.CKD273_Comparison.md'
  - "Signature Validation":
